name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-arm-linux-gnueabi \
          make \
          zip
        
    - name: Build for ARM
      run: |
        cd ethereal-os
        make clean || true
        make CC=aarch64-linux-gnu-gcc CXX=arm-linux-gnueabi-g++
        
    - name: Create APK structure
      run: |
        mkdir -p apk/lib/arm64-v8a
        cp src/*.so apk/lib/arm64-v8a/ 2>/dev/null || true
        cp src/eth-os apk/lib/arm64-v8a/ 2>/dev/null || true
        cd apk
        zip -r ../eth-os.zip .
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: eth-os-build
        path: eth-os.zip
